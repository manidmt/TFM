# Nginx config for the internal nginx container.
#
# This nginx runs INSIDE Docker (not on the host).
# It has two jobs:
#   1. Serve the React static build (SPA with fallback to index.html)
#   2. Proxy /api/ to the FastAPI container
#
# TLS is handled upstream by Cloudflare Tunnel — this nginx speaks plain HTTP.
# Reference: rpi5.md §5.1, §13.4, §13.5

server {
    listen 80;
    server_name _;

    # React static build (mounted from /srv/quant-risk/static on the host)
    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker's internal DNS — forces re-resolution on each upstream connection
    # so that restarted/recreated API containers are picked up automatically.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy /api/ → FastAPI container (service name "api" inside compose network)
    location /api/ {
        set $upstream http://api:8000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tell FastAPI it's behind HTTPS (Cloudflare handles TLS)
        proxy_set_header   X-Forwarded-Proto https;

        # Cookie passthrough — session cookies must not be stripped.
        proxy_pass_header  Set-Cookie;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
