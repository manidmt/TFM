# Docker Compose — RPi5 production runtime.
#
# Edge: Cloudflare Tunnel (cloudflared) → nginx container → api container
# No host-level nginx or TLS termination needed; Cloudflare handles TLS.
#
# Persistent services (started with `docker compose up -d`):
#   postgres  — auth/portfolio database
#   api       — FastAPI backend (internal, not exposed to host)
#   nginx     — serves React static build + proxies /api/ to FastAPI
#              Cloudflare Tunnel points to http://localhost:8080
#
# Run-once service:
#   worker    — daily batch; NOT started by `up`.
#              Launched by systemd timer via:
#                docker compose -f ops/docker/compose.rpi5.yml run --rm worker
#
# Required env vars — copy ops/docker/.env.example to ops/docker/.env and fill:
#   POSTGRES_PASSWORD   — Postgres superuser password
#   COOKIE_SECRET       — random 32-byte hex (openssl rand -hex 32)
#
# Reference: rpi5.md §5.1, §11, §13, §22

name: quant-risk

services:

  # -------------------------------------------------------------------------
  # Postgres — users, sessions, portfolios (rpi5.md §11.3)
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quant_risk
      POSTGRES_USER: quant_risk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /srv/quant-risk/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_risk -d quant_risk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # -------------------------------------------------------------------------
  # API — FastAPI backend (internal to compose network, rpi5.md §13.1)
  # Not exposed to the host; nginx container proxies /api/ to it.
  # -------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.api
    image: quant-risk-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUANT_RISK_POSTGRES_URL: "postgresql://quant_risk:${POSTGRES_PASSWORD}@postgres:5432/quant_risk"
      QUANT_RISK_SERVING_DB_PATH: /data/serving.duckdb
      QUANT_RISK_DB_PATH: /data/financial_data.duckdb
      QUANT_RISK_COOKIE_SECRET: ${COOKIE_SECRET}
      QUANT_RISK_COOKIE_SECURE: "true"
    volumes:
      # DuckDB files mounted read-only (worker writes, api reads)
      - /srv/quant-risk/db:/data:ro
    # No host port binding — only reachable inside the compose network via "api:8000"
    expose:
      - "8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # -------------------------------------------------------------------------
  # Nginx — static frontend + /api/ reverse proxy (rpi5.md §13.4, §13.5)
  #
  # Cloudflare Tunnel points to http://localhost:8080 (loopback only).
  # TLS is handled by Cloudflare; this nginx speaks plain HTTP.
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Nginx config
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # React static build — rebuilt on each app release, mounted read-only
      - /srv/quant-risk/static:/usr/share/nginx/html:ro
    ports:
      # Bind only to loopback — cloudflared connects here.
      - "127.0.0.1:8080:80"
    networks:
      - backend

  # -------------------------------------------------------------------------
  # Worker — run-once daily batch (rpi5.md §10, §13.2)
  #
  # NOT started by `docker compose up`.
  # Invoked by the systemd timer:
  #   docker compose -f ops/docker/compose.rpi5.yml \
  #     --env-file ops/docker/.env run --rm worker
  # -------------------------------------------------------------------------
  worker:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.worker
    image: quant-risk-worker:latest
    restart: "no"
    profiles:
      - worker
    environment:
      QUANT_RISK_SERVING_DB_PATH: /data/serving.duckdb
      QUANT_RISK_DB_PATH: /data/financial_data.duckdb
    volumes:
      # DuckDB files read-write (worker ingests and writes predictions)
      - /srv/quant-risk/db:/data
      # Bundles mounted read-only for inference
      - /srv/quant-risk/bundles:/srv/quant-risk/bundles:ro
    networks:
      - backend

networks:
  backend:
    driver: bridge
