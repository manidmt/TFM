[tool.poetry]
name = "quant-risk-tfm"
version = "0.1.0"
description = "Framework for TFM"
authors = ["Manuel <manidmt5@gmail.com>"]
readme = "README.md"
packages = [{include = "quant_risk", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
# --- Core ---
numpy = "^1.26.0"
pandas = "^2.2.0"
yfinance = "^0.2.36"
duckdb = "^0.9.2"
pyyaml = "^6.0"

# --- Models ---
scikit-learn = "^1.4.0"
hmmlearn = "^0.3.0"
arch = "^7.0.0"
torch = "^2.2.0"
torchsde = "^0.2.6"

# --- Tracking ---
mlflow = "^2.13"

# --- App ---
streamlit = "^1.31.0"
plotly = "^5.18.0"
matplotlib = "^3.8.0"
pandas-datareader = "^0.10.0"
xgboost = "^3.2.0"
pytorch-tabnet = "^4.1.0"
tabpfn = "^6.4.1"
optuna = "^4.7.0"

[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.1.0"
ipykernel = "^6.29.0"
seaborn = "^0.13.0"
pytest = "^8.0.0"
black = "^24.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"