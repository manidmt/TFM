# Ticker universe for portfolio autocomplete.
#
# Each entry maps a tradeable ticker to one of the 6 production proxy assets.
# The proxy_asset_id determines which volatility regime prediction is used
# when this ticker appears in a user portfolio.
#
# asset_class values: us_equity, euro_equity, crypto, bond_long, bond_short, commodity
# proxy_asset_id values: us_equities, euro_equities, bitcoin, long_us_treasuries,
#                        short_us_treasuries, gold

version: "1.0.0"

tickers:

  # ─────────────────────────────────────────────────────────────────────────────
  # Production proxy indices & ETFs (the 6 core assets)
  # ─────────────────────────────────────────────────────────────────────────────
  - ticker: "^GSPC"
    display_name: "S&P 500 Index"
    asset_class: us_equity
    proxy_asset_id: us_equities

  - ticker: "^STOXX50E"
    display_name: "EURO STOXX 50 Index"
    asset_class: euro_equity
    proxy_asset_id: euro_equities

  - ticker: "BTC-USD"
    display_name: "Bitcoin"
    asset_class: crypto
    proxy_asset_id: bitcoin

  - ticker: "TLT"
    display_name: "iShares 20+ Year Treasury Bond ETF"
    asset_class: bond_long
    proxy_asset_id: long_us_treasuries

  - ticker: "SHY"
    display_name: "iShares 1-3 Year Treasury Bond ETF"
    asset_class: bond_short
    proxy_asset_id: short_us_treasuries

  - ticker: "GLD"
    display_name: "SPDR Gold Shares"
    asset_class: commodity
    proxy_asset_id: gold

