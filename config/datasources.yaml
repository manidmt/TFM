db:
  path: data/db/financial_data.duckdb

prices:
  tickers:
    - "^GSPC"
    - "BTC-USD"
    - "TLT"
  default_start: "2010-01-01"
  auto_adjust: true
  lookback_buffer_days: 5

macro:
  default_start: "2010-01-01"
  lookback_buffer_days: 10
  fred_series:
    VIXCLS: vix
    WALCL: fed_assets
    WTREGEN: tga
    RRPONTSYD: rrp
    M2SL: m2
    DFF: ffr
    SOFR: sofr

gdelt:
  enabled: false
  table: "gdelt_gkg_daily"
  start: "2018-01-01"
  lookback_buffer_days: 14
  publication_lag_bdays: 1
  mode: "timeline"
  keep_artlist_sample: false
  query: "(finance OR market OR stocks OR bitcoin OR treasury)"
  max_records_per_day: 250
  timeout_seconds: 30
