# Grid search para scripts/train_tabular_xgb.py
# Uso sugerido (loop externo):
# python scripts/train_tabular_xgb.py --horizon 20 --tickers ^GSPC BTC-USD TLT ...

grid:
  horizon: [5, 20]
  pooled: [false, true]
  use_sarimax: [false, true]
  use_garch: [false, true]

  n_estimators: [200, 400, 700]
  max_depth: [3, 5, 7]
  learning_rate: [0.03, 0.05, 0.1]
  subsample: [0.8, 0.9]
  colsample_bytree: [0.8, 0.9]
  min_child_weight: [1.0, 3.0]
  reg_lambda: [1.0, 5.0]
  seed: [42]
