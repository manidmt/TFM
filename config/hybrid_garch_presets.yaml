# Presets para scripts/train_hybrid_garch_tabular.py
# Uso sugerido:
# 1) Elige un preset de este archivo.
# 2) Ejecuta el script pasando los flags correspondientes.
#
# Ejemplo base:
# python scripts/train_hybrid_garch_tabular.py \
#   --horizon 20 \
#   # toma tickers por defecto desde config/datasources.yaml \
#   --garch_variants 11,1-2,2-1

presets:
  default_h20:
    description: "Preset por defecto (h=20, GARCH(1,1), universo base de activos)."
    config_features: "config/features.yaml"
    config_sources: "config/datasources.yaml"
    horizon: 20
    pooled: false
    garch_variants: "11"
    garch_dist: "normal"
    garch_mean: "zero"
    garch_vol: "Garch"
    garch_target_col: "logret"
    garch_scale: 100.0
    garch_annualize: false
    rf_estimators: 400
    rf_min_leaf: 5
    outdir: "runs/hybrid_garch"

  robust_h20_multi_pq:
    description: "Más robusto: múltiples órdenes (p,q) para comparación."
    config_features: "config/features.yaml"
    config_sources: "config/datasources.yaml"
    horizon: 20
    pooled: false
    garch_variants: "11,1-2,2-1"
    garch_dist: "normal"
    garch_mean: "zero"
    garch_vol: "Garch"
    garch_target_col: "logret"
    garch_scale: 100.0
    garch_annualize: false
    rf_estimators: 500
    rf_min_leaf: 5
    outdir: "runs/hybrid_garch"

  short_h5_fast:
    description: "Ejecución más rápida para pruebas (h=5, menos árboles)."
    config_features: "config/features.yaml"
    config_sources: "config/datasources.yaml"
    horizon: 5
    pooled: false
    garch_variants: "11"
    garch_dist: "normal"
    garch_mean: "zero"
    garch_vol: "Garch"
    garch_target_col: "logret"
    garch_scale: 80.0
    garch_annualize: false
    rf_estimators: 200
    rf_min_leaf: 8
    outdir: "runs/hybrid_garch_fast"

  pooled_annualized:
    description: "Entrenamiento pooled y volatilidad anualizada."
    config_features: "config/features.yaml"
    config_sources: "config/datasources.yaml"
    horizon: 20
    pooled: true
    garch_variants: "11,1-2"
    garch_dist: "normal"
    garch_mean: "zero"
    garch_vol: "Garch"
    garch_target_col: "logret"
    garch_scale: 100.0
    garch_annualize: true
    rf_estimators: 400
    rf_min_leaf: 5
    outdir: "runs/hybrid_garch_pooled_annualized"

commands_examples:
  - name: "default_h20"
    command: "python scripts/train_hybrid_garch_tabular.py --horizon 20 --garch_variants 11"
  - name: "robust_h20_multi_pq"
    command: "python scripts/train_hybrid_garch_tabular.py --horizon 20 --garch_variants 11,1-2,2-1"
  - name: "short_h5_fast"
    command: "python scripts/train_hybrid_garch_tabular.py --horizon 5 --garch_variants 11 --rf_estimators 200 --rf_min_leaf 8"
  - name: "pooled_annualized"
    command: "python scripts/train_hybrid_garch_tabular.py --horizon 20 --pooled --garch_variants 11,1-2 --garch_annualize"
